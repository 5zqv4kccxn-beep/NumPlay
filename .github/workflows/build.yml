name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ARM toolchain
        run: |
          v=15.2.1-1.1
          curl -sSL "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$v/xpack-arm-none-eabi-gcc-$v-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xpack-arm-none-eabi-gcc-$v/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tools
        run: npm install -g nwlink@1.0.0

      - name: Build
        run: make -j4 nwa check NWLINK=nwlink

      - uses: actions/upload-artifact@v4
        with:
          name: nwa
          path: build/NumPlay*.nwa
